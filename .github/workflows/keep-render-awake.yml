name: Keep QR Vision Render API Awake

on:
  schedule:
    # Runs every 10 minutes.
    # Render free services sleep after 15 minutes of inactivity.
    # GitHub Actions cron uses UTC time.
    - cron: "*/10 * * * *"

  # Allows manual run from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    env:
      URLS: |
        https://qr-vision-ss-api.onrender.com/health

    steps:
      - name: Ping QR Vision Render API
        shell: bash
        run: |
          echo "Starting QR Vision Render keep-awake ping..."

          while IFS= read -r url; do
            url="$(echo "$url" | xargs)"

            if [ -z "$url" ] || [[ "$url" == \#* ]]; then
              continue
            fi

            echo "----------------------------------------"
            echo "Pinging: $url"

            http_code=$(curl -L -sS -o /dev/null -w "%{http_code}" \
              --max-time 60 \
              --connect-timeout 20 \
              --retry 2 \
              --retry-delay 5 \
              "$url") || http_code="000"

            echo "Response code: $http_code"

            if [[ "$http_code" =~ ^2|^3 ]]; then
              echo "OK: QR Vision API is awake."
            elif [[ "$http_code" =~ ^4 ]]; then
              echo "Warning: QR Vision API responded with client error $http_code. Check the endpoint path."
            elif [[ "$http_code" =~ ^5 ]]; then
              echo "Warning: QR Vision API responded with server error $http_code. The service may be awake but has an internal issue."
            else
              echo "Error: Could not reach QR Vision API."
            fi
          done <<< "$URLS"

          echo "----------------------------------------"
          echo "Keep-awake job finished."